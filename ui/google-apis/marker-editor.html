<!DOCTYPE html>
<!--
  Phase 4: Marker Editor Reference
  The inline marker editor modal markup. Rendered by JavaScript
  when the user clicks "マーカーを追加" in the properties panel.
-->
<div class="google-modal-header">
  <div class="google-modal-logo">📍</div>
  <div class="google-modal-title-block">
    <h2 id="markerEditorTitle">マーカーを追加</h2>
    <p>マップに表示するマーカーを設定します</p>
  </div>
</div>

<div class="marker-form">
  <div>
    <label for="markerTitleInput">タイトル</label>
    <input type="text" id="markerTitleInput" class="maps-props-input"
           placeholder="マーカーのタイトル" style="width:100%;box-sizing:border-box;">
  </div>
  <div>
    <label for="markerSnippetInput">説明 (Snippet)</label>
    <input type="text" id="markerSnippetInput" class="maps-props-input"
           placeholder="マーカーをクリックしたときに表示されるテキスト"
           style="width:100%;box-sizing:border-box;">
  </div>
  <div class="marker-form-row">
    <div style="flex:1;">
      <label for="markerLatInput">緯度</label>
      <input type="number" id="markerLatInput" class="maps-props-input"
             value="35.6762" step="0.0001" min="-90" max="90" style="width:100%;box-sizing:border-box;">
    </div>
    <div style="flex:1;">
      <label for="markerLngInput">経度</label>
      <input type="number" id="markerLngInput" class="maps-props-input"
             value="139.6503" step="0.0001" min="-180" max="180" style="width:100%;box-sizing:border-box;">
    </div>
  </div>
  <div>
    <label for="markerHandlerInput">クリックハンドラ (Kotlin)</label>
    <input type="text" id="markerHandlerInput" class="maps-props-input"
           placeholder="例: showToast(marker.title)"
           style="width:100%;box-sizing:border-box;">
  </div>
</div>
