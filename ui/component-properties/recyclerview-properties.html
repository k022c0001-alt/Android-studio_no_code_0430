<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RecyclerView Properties</title>
<style>
  body { font-family: Roboto, sans-serif; font-size: 13px; margin: 0; padding: 8px; }
  .prop-group { margin-bottom: 10px; }
  label { display: block; font-size: 11px; font-weight: 600; color: #5f6368; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  input, select { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
  input:focus, select:focus { outline: none; border-color: #6200EE; }
  .preview { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .item { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #eee; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); flex-shrink: 0; }
  .text { flex: 1; }
  .title-text { font-size: 14px; font-weight: 500; }
  .sub-text { font-size: 11px; color: #666; margin-top: 2px; }
  h3 { font-size: 14px; margin: 0 0 10px; color: #202124; }
  .adapter-section { background: #f8f9fa; border-radius: 4px; padding: 8px; font-size: 11px; color: #333; font-family: monospace; margin-top: 8px; line-height: 1.5; }
  .dep-badge { background: #E8EAF6; color: #3F51B5; border-radius: 4px; padding: 4px 8px; font-size: 11px; margin-top: 8px; display: inline-block; }
</style>
</head>
<body>
<h3>♻️ RecyclerView</h3>
<div class="preview">
  <div class="item">
    <div class="avatar"></div>
    <div class="text">
      <div class="title-text">アイテム 1</div>
      <div class="sub-text">サブテキスト</div>
    </div>
  </div>
  <div class="item">
    <div class="avatar" style="background:linear-gradient(135deg,#f093fb,#f5576c)"></div>
    <div class="text">
      <div class="title-text">アイテム 2</div>
      <div class="sub-text">サブテキスト</div>
    </div>
  </div>
  <div class="item">
    <div class="avatar" style="background:linear-gradient(135deg,#4facfe,#00f2fe)"></div>
    <div class="text">
      <div class="title-text">アイテム 3</div>
      <div class="sub-text">サブテキスト</div>
    </div>
  </div>
</div>

<div class="prop-group">
  <label>Layout Manager</label>
  <select>
    <option>LinearLayoutManager</option>
    <option>GridLayoutManager</option>
    <option>StaggeredGridLayoutManager</option>
  </select>
</div>
<div class="prop-group">
  <label>Orientation</label>
  <select>
    <option>vertical</option>
    <option>horizontal</option>
  </select>
</div>
<div class="prop-group">
  <label>Has Fixed Size</label>
  <input type="checkbox" checked>
</div>
<div class="prop-group">
  <label>Item Decoration</label>
  <select>
    <option>DividerItemDecoration</option>
    <option>None</option>
  </select>
</div>

<div class="dep-badge">📦 androidx.recyclerview:recyclerview:1.3.0</div>

<div class="adapter-section">
// Adapter template generated automatically<br>
class MyAdapter(private val items: List&lt;String&gt;) :<br>
&nbsp;&nbsp;RecyclerView.Adapter&lt;...&gt;() { ... }
</div>
</body>
</html>
